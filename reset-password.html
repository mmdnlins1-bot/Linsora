<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Redefina sua senha de acesso ao Linsora com segurança.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="linsora:supabase-url" content="">
  <meta name="linsora:supabase-anon-key" content="">
  <title>Redefinir senha — Linsora</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    :root {
      --bg: #070B12;
      --card: #111C30;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --accent: #10B981;
      --accent-dark: #059669;
      --danger: #F87171;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 15%, #111C30 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(17, 26, 44, 0.9);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .brand img { width: 36px; height: 36px; }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 12px; }
    p strong { color: var(--text); }
    .field { text-align: left; margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
    .field input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 15px;
    }
    .field input:focus { outline: none; border-color: var(--accent); }
    .field input:disabled { opacity: 0.5; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #FFFFFF; border: none; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .status { border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.5; margin-bottom: 16px; }
    .status-info { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: var(--muted); }
    .status-error { background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.4); color: #FCA5A5; }
    .status-success { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.4); color: #6EE7B7; }
    .back { display: inline-block; margin-top: 18px; font-size: 14px; color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--text); text-decoration: underline; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="icon-192.png" alt="Linsora Logo"><span>LINSORA</span></div>
    <h1>Redefinir sua senha</h1>

    <div id="recoveryStatus" class="status status-info" role="status">Verificando link de recuperação…</div>

    <form id="resetPasswordForm" class="hidden" onsubmit="return false;" autocomplete="off">
      <div class="field">
        <label for="newPassword">Nova senha</label>
        <input type="password" id="newPassword" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" required disabled>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirmar nova senha</label>
        <input type="password" id="confirmPassword" placeholder="Repita a nova senha" autocomplete="new-password" minlength="6" required disabled>
      </div>
      <button type="submit" id="btnSaveNewPassword" class="btn btn-primary" disabled>Salvar nova senha</button>
    </form>

    <div id="recoveryActions" class="hidden">
      <a id="btnBackToLoginPrimary" class="btn btn-primary hidden" href="/">Voltar para o login</a>
    </div>

    <a id="linkBackLogin" class="back" href="/">Voltar para o login</a>
  </main>

  <script src="js/lib/supabase.min.js"></script>
  <script>
    /**
     * LINSORA — Página de redefinição de senha (fluxo "Esqueci minha senha").
     * Fluxo: link do e-mail -> sessão de recuperação -> updateUser (1x) ->
     * logout da sessão de recuperação -> voltar ao login. Nunca concede
     * acesso ao app; o usuário segue sujeito ao subscription gate normal.
     * Sem segredos: usa somente URL pública + anon key (meta tags injetadas
     * no build ou override de automação). Nunca registra senha ou token.
     */
    (function () {
      'use strict';

      var MIN_PASSWORD_LENGTH = 6;
      var statusEl = document.getElementById('recoveryStatus');
      var formEl = document.getElementById('resetPasswordForm');
      var newPasswordEl = document.getElementById('newPassword');
      var confirmPasswordEl = document.getElementById('confirmPassword');
      var saveBtn = document.getElementById('btnSaveNewPassword');
      var actionsEl = document.getElementById('recoveryActions');
      var backPrimaryBtn = document.getElementById('btnBackToLoginPrimary');

      var state = {
        client: null,
        ready: false,
        saving: false,
        updateAttempted: false,
        recoveryExpired: false,
      };
      var BOOT_TIMEOUT_MS = 5000;

      function isValidRecoverySession(session) {
        return !!(session && session.user && session.access_token);
      }

      function sanitizeErrorInfo(e) {
        var info = {};
        try {
          if (e && typeof e === 'object') {
            if (e.code != null) info.code = String(e.code).slice(0, 120);
            if (e.status != null) info.status = String(e.status).slice(0, 120);
            if (e.name != null) info.name = String(e.name).slice(0, 120);
            if (e.message != null) info.message = String(e.message).slice(0, 300);
          } else if (e != null) {
            info.message = String(e).slice(0, 300);
          }
        } catch (err) { /* nunca quebra por causa do log */ }
        return info;
      }

      function mapUpdateUserError(e) {
        var info = sanitizeErrorInfo(e);
        var code = String(info.code || '').toLowerCase();
        var status = String(info.status || '').toLowerCase();
        var name = String(info.name || '').toLowerCase();
        var msg = String(info.message || '').toLowerCase();
        var joined = code + ' ' + status + ' ' + name + ' ' + msg;
        var isMissing = /authsessionmissing|auth session missing/.test(joined);
        var isJwt = /invalid jwt|jwt expired|jwt_expired|expired|invalid token|session expired|session missing|401/.test(joined);
        if (isMissing || /401/.test(status) || /401/.test(code) || isJwt) {
          return {
            kind: 'expired',
            message: 'Sua sessão de recuperação expirou. Solicite um novo link para redefinir sua senha.',
            info: { code: info.code, status: info.status, name: info.name },
          };
        }
        if (/password|weak|at least|short|mínimo|minimo|6 char/.test(joined)) {
          return {
            kind: 'weak',
            message: 'A nova senha não atende aos requisitos mínimos. Use no mínimo 6 caracteres e tente novamente.',
            info: { code: info.code, status: info.status, name: info.name },
          };
        }
        if (/failed to fetch|network|fetch failed|timeout|timed out|abort|offline|enotfound|econn|typeerror/.test(joined) || e instanceof TypeError) {
          return {
            kind: 'network',
            message: 'Não foi possível concluir agora. Verifique sua conexão e tente novamente.',
            info: { code: info.code, status: info.status, name: info.name },
          };
        }
        return {
          kind: 'generic',
          message: 'Não foi possível salvar a nova senha. Tente novamente.',
          info: { code: info.code, status: info.status, name: info.name },
        };
      }

      function setStatus(kind, message) {
        statusEl.className = 'status status-' + kind;
        statusEl.textContent = message;
      }

      function setFormEnabled(enabled) {
        newPasswordEl.disabled = !enabled;
        confirmPasswordEl.disabled = !enabled;
        saveBtn.disabled = !enabled;
      }

      function showForm() {
        formEl.classList.remove('hidden');
        setFormEnabled(true);
      }

      function hideForm() {
        formEl.classList.add('hidden');
        setFormEnabled(false);
      }

      function showInvalid(message) {
        // Um estado de boot inválido nunca deve sobrescrever um estado já válido.
        if (state.ready) return;
        hideForm();
        setStatus('error', message);
      }

      function showExpiredSession(message) {
        state.recoveryExpired = true;
        state.updateAttempted = true;
        setFormEnabled(false);
        setStatus('error', message);
      }

      function readMetaContent(name) {
        try {
          var els = document.querySelectorAll('meta[name="' + name + '"]');
          for (var i = 0; i < els.length; i++) {
            var content = (els[i].getAttribute('content') || '').trim();
            if (content) return content;
          }
        } catch (e) { /* sem meta */ }
        return '';
      }

      function getPublicConfig() {
        try {
          var override = window.__LINSORA_SUPABASE__;
          if (override && typeof override === 'object') {
            var oUrl = String(override.url || '').trim();
            var oKey = String(override.anonKey || override.key || '').trim();
            if (oUrl && oKey) return { url: oUrl, key: oKey };
          }
        } catch (e) { /* sem override */ }
        var url = readMetaContent('linsora:supabase-url');
        var key = readMetaContent('linsora:supabase-anon-key');
        if (url && key) return { url: url, key: key };
        return null;
      }

      // O link de recuperação chega com ?code= (PKCE) ou #access_token (ou
      // erro). Sem nenhum desses sinais, não há sessão a estabelecer.
      function hasRecoveryParams() {
        try {
          var search = new URLSearchParams(window.location.search);
          if (search.get('code')) return true;
        } catch (e) { /* sem query */ }
        var hash = String(window.location.hash || '');
        return /(^|[#&])(access_token|type=recovery|error)=/.test(hash);
      }

      function cleanRecoveryParamsFromUrl() {
        try {
          var url = new URL(window.location.href);
          url.searchParams.delete('code');
          url.hash = '';
          window.history.replaceState(null, '', url.pathname + url.search);
        } catch (e) { /* limpeza opcional; nunca bloqueia o fluxo */ }
      }

      function markReady() {
        if (state.ready) return;
        state.ready = true;
        // O hash/query de recuperação permanece na URL até o sucesso,
        // pois é necessário ao fluxo IMPLICIT e ao retry após reload.
        setStatus('info', 'Link verificado. Defina sua nova senha abaixo.');
        showForm();
      }

      async function boot() {
        if (!hasRecoveryParams()) {
          showInvalid('Link inválido ou ausente. Solicite um novo link de recuperação na tela de login.');
          return;
        }
        var config = getPublicConfig();
        if (!config || !window.supabase || typeof window.supabase.createClient !== 'function') {
          showInvalid('Serviço indisponível no momento. Tente novamente mais tarde.');
          return;
        }
        var client;
        try {
          // Fluxo IMPLICIT: consome o hash (#access_token + type=recovery) e
          // estabelece a sessão de recuperação. Propositalmente separado do
          // cliente principal do app, que usa detectSessionInUrl: false.
          client = window.supabase.createClient(config.url, config.key, {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true,
            },
          });
        } catch (e) {
          showInvalid('Serviço indisponível no momento. Tente novamente mais tarde.');
          return;
        }
        state.client = client;
        var bootDone = false;
        var bootTimer = null;
        function finishReady() {
          if (bootDone || state.ready) {
            bootDone = true;
            if (bootTimer) { try { clearTimeout(bootTimer); } catch (e) {} bootTimer = null; }
            return;
          }
          bootDone = true;
          if (bootTimer) { try { clearTimeout(bootTimer); } catch (e) {} bootTimer = null; }
          markReady();
        }
        function finishInvalid() {
          if (bootDone || state.ready) return;
          bootDone = true;
          showInvalid('Este link expirou ou é inválido. Solicite um novo link de recuperação na tela de login.');
        }
        // Listener primeiro: a prova preferencial é PASSWORD_RECOVERY com
        // sessão válida (user + access_token). SIGNED_IN/INITIAL_SESSION,
        // isoladamente, não liberam o formulário.
        try {
          client.auth.onAuthStateChange(function (event, session) {
            if (event === 'PASSWORD_RECOVERY' && isValidRecoverySession(session)) {
              finishReady();
            }
          });
        } catch (e) { /* listener opcional; getSession + timeout decidem */ }
        // Cobertura síncrona: sessão pode já ter sido estabelecida antes do listener.
        try {
          var res = await client.auth.getSession();
          var early = res && res.data ? res.data.session : null;
          if (isValidRecoverySession(early)) {
            finishReady();
            return;
          }
        } catch (e) { /* segue para a espera do evento */ }
        if (bootDone) return;
        // Espera baseada em evento + timeout de segurança (~5s), sem polling.
        var innerSub = null;
        await new Promise(function (resolve) {
          var settled = false;
          function done() {
            if (settled) return;
            settled = true;
            resolve();
          }
          try {
            var r = client.auth.onAuthStateChange(function (event, session) {
              if (event === 'PASSWORD_RECOVERY' && isValidRecoverySession(session)) {
                finishReady();
                done();
              }
            });
            innerSub = (r && r.data && r.data.subscription) || null;
          } catch (e) { /* getSession final abaixo decide */ }
          bootTimer = setTimeout(function () {
            bootTimer = null;
            done();
          }, BOOT_TIMEOUT_MS);
        });
        try {
          if (innerSub && typeof innerSub.unsubscribe === 'function') innerSub.unsubscribe();
        } catch (e) { /* limpeza best-effort */ }
        innerSub = null;
        if (bootDone || state.ready) return;
        // Verificação final única (não é polling): cobre evento que chegou
        // sem notificar este boot (ex.: listener registrado após o evento).
        try {
          var late = await client.auth.getSession();
          var lateSession = late && late.data ? late.data.session : null;
          if (isValidRecoverySession(lateSession)) {
            finishReady();
            return;
          }
        } catch (e) { /* trata como inválido abaixo */ }
        finishInvalid();
      }

      async function handleSubmit() {
        if (!state.ready || !state.client || state.saving) return;
        if (state.recoveryExpired) {
          showExpiredSession('Sua sessão de recuperação expirou. Solicite um novo link para redefinir sua senha.');
          return;
        }
        if (state.updateAttempted) return;
        var password = String(newPasswordEl.value || '');
        var confirm = String(confirmPasswordEl.value || '');
        if (password.length < MIN_PASSWORD_LENGTH) {
          setStatus('error', 'A senha deve conter no mínimo 6 caracteres.');
          return;
        }
        if (password !== confirm) {
          setStatus('error', 'As senhas não coincidem. Digite novamente.');
          return;
        }
        // Trava síncrona anti-duplo-submit: o segundo submit concorrente
        // encontra saving=true e retorna antes de qualquer await.
        state.saving = true;
        state.updateAttempted = true;
        setFormEnabled(false);
        saveBtn.textContent = 'Salvando…';
        setStatus('info', 'Salvando sua nova senha…');
        // Revalida a sessão IMPLICIT imediatamente antes do updateUser.
        var current = null;
        try {
          var sessRes = await state.client.auth.getSession();
          current = sessRes && sessRes.data ? sessRes.data.session : null;
        } catch (e) {
          current = null;
        }
        if (!isValidRecoverySession(current)) {
          state.saving = false;
          saveBtn.textContent = 'Salvar nova senha';
          showExpiredSession('Sua sessão de recuperação expirou. Solicite um novo link para redefinir sua senha.');
          try {
            console.warn('[LINSORA Recovery] updateUser bloqueado: sessão ausente/expirada.');
          } catch (e) {}
          return;
        }
        try {
          var result = await state.client.auth.updateUser({ password: password });
          if (!result || result.error) throw result ? result.error : new Error('update-failed');
        } catch (e) {
          var mapped = mapUpdateUserError(e);
          try {
            console.warn('[LINSORA Recovery] updateUser falhou.', mapped.info || {});
          } catch (logErr) {}
          state.saving = false;
          saveBtn.textContent = 'Salvar nova senha';
          if (mapped.kind === 'expired') {
            showExpiredSession(mapped.message);
            return;
          }
          // Erro recuperável (rede/fraca/genérica): permite nova tentativa,
          // sem limpar o hash para preservar o retry.
          state.updateAttempted = false;
          setFormEnabled(true);
          setStatus('error', mapped.message);
          return;
        }
        try {
          await state.client.auth.signOut();
        } catch (e) { /* sessão local já invalidada; segue para o sucesso */ }
        state.saving = false;
        // Somente após updateUser + signOut o link pode ser higienizado.
        cleanRecoveryParamsFromUrl();
        hideForm();
        setStatus('success', 'Senha alterada com sucesso. Entre novamente com sua nova senha.');
        actionsEl.classList.remove('hidden');
        backPrimaryBtn.classList.remove('hidden');
      }

      if (formEl) {
        formEl.addEventListener('submit', function (e) {
          if (e) e.preventDefault();
          handleSubmit();
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }

      // Teclado virtual (mobile): equivalente ao tratamento compartilhado
      // do app — mantém o campo em foco visível. Somente mobile, sem
      // polling, sem loops, sem roubar foco. Não toca no fluxo de recovery.
      (function initMobileKeyboardHandling() {
        try {
          if (typeof window === 'undefined' || !window.matchMedia) return;
          var isMobileView = function () {
            try { return window.matchMedia('(max-width: 768px)').matches; }
            catch (e) { return false; }
          };
          var isField = function (el) {
            var tag = el && el.tagName ? String(el.tagName).toLowerCase() : '';
            return tag === 'input' || tag === 'textarea' || tag === 'select';
          };
          var isInVisibleArea = function (el) {
            try {
              var rect = el.getBoundingClientRect();
              var vv = window.visualViewport || null;
              var viewTop = vv && typeof vv.offsetTop === 'number' ? vv.offsetTop : 0;
              var viewHeight = vv && typeof vv.height === 'number'
                ? vv.height
                : (window.innerHeight || 0);
              return rect.top >= viewTop - 1 && rect.bottom <= viewTop + viewHeight + 1;
            } catch (e) { return true; }
          };
          var ensureFieldVisible = function (el) {
            if (!el || !isField(el) || !isMobileView()) return;
            if (document.activeElement !== el) return;
            if (isInVisibleArea(el)) return;
            try {
              el.scrollIntoView({ block: 'center', behavior: 'smooth' });
            } catch (e) {
              try { el.scrollIntoView({ block: 'center' }); }
              catch (e2) { /* ignora */ }
            }
          };
          document.addEventListener('focusin', function (e) {
            var target = e && e.target ? e.target : null;
            if (!isField(target) || !isMobileView()) return;
            window.requestAnimationFrame(function () { ensureFieldVisible(target); });
          }, { passive: true });
          var vv = window.visualViewport;
          if (vv && typeof vv.addEventListener === 'function') {
            var handling = false;
            vv.addEventListener('resize', function () {
              if (handling) return;
              if (!isMobileView()) return;
              var active = document.activeElement;
              if (!isField(active)) return;
              var viewHeight = 0;
              try { viewHeight = vv.height; } catch (e) { viewHeight = 0; }
              if (!viewHeight || viewHeight >= (window.innerHeight || 0) - 1) return;
              handling = true;
              try { ensureFieldVisible(active); }
              finally {
                window.requestAnimationFrame(function () { handling = false; });
              }
            });
          }
        } catch (e) { /* nunca quebra a página */ }
      })();
    })();
  </script>
</body>
</html>
